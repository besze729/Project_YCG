[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ycg-video-processing-service"
version = "0.1.0"
description = "Local FFmpeg proxy creation and frame sampling for Project YCG"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ycg-video = "video_processing_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_processing_service = ["config.toml"]
