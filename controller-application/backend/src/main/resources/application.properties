spring.application.name=ControllerApplication
server.address=127.0.0.1
server.port=8080

ycg.lm-studio.base-url=${LM_STUDIO_BASE_URL:http://127.0.0.1:1234}
ycg.lm-studio.model=${LM_STUDIO_MODEL:qwen3-14b}
ycg.lm-studio.connect-timeout=${LM_STUDIO_CONNECT_TIMEOUT:3s}
ycg.lm-studio.request-timeout=${LM_STUDIO_REQUEST_TIMEOUT:10m}
ycg.lm-studio.api-token=${LM_STUDIO_API_TOKEN:}
# The installed server label in LM Studio's mcp.json; empty disables tool access.
ycg.lm-studio.integration-id=${LM_STUDIO_INTEGRATION_ID:mcp/parallel-search}
