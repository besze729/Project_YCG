[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ycg-video-processing-service"
version = "0.1.0"
description = "Local FFmpeg proxy creation and frame sampling for Project YCG"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
ycg-video = "video_processing_service.cli:main"
ycg-video-server = "video_processing_service.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_processing_service = ["config.toml"]
"video_processing_service.vision" = ["config.toml", "*.tpl"]
